name: Release v1.4 compression build

on:
  workflow_run:
    workflows: ["Build macOS Apple Silicon"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful main Build macOS Apple Silicon run ID (optional)'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: kcc-kindle-cn-v14-release
  cancel-in-progress: true

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PRODUCT_NAME: Kindle漫画转换器
      PRODUCT_VERSION: 1.4.0
      RELEASE_TAG: v1.4.0
      SOURCE_ARTIFACT: KCC-Kindle-CN-v1.3-AppleSilicon
      FINAL_ARTIFACT: KCC-Kindle-CN-v1.4-AppleSilicon
      DMG_NAME: KCC_11.0.1_Kindle_CN_v1.4_AppleSilicon.dmg
      APP_ZIP_NAME: Kindle漫画转换器_v1.4_AppleSilicon.app.zip

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve tested source build run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${INPUT_RUN_ID:-${EVENT_RUN_ID:-}}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build-macos-arm64.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"

          EVENT="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json event --jq .event)"
          BRANCH="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch --jq .headBranch)"
          CONCLUSION="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          test "$BRANCH" = "main"
          test "$CONCLUSION" = "success"
          echo "source run: $RUN_ID ($EVENT / $BRANCH / $CONCLUSION)"
          echo "$RUN_ID" > "$RUNNER_TEMP/source-run-id.txt"

      - name: Download fully tested Apple Silicon artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(cat "$RUNNER_TEMP/source-run-id.txt")"
          mkdir -p "$RUNNER_TEMP/source-artifact"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir "$RUNNER_TEMP/source-artifact"
          find "$RUNNER_TEMP/source-artifact" -maxdepth 5 -type f -print

      - name: Extract App and verify compression engines are bundled
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APP_ZIP="$(find "$RUNNER_TEMP/source-artifact" -type f -name '*.app.zip' -print -quit)"
          test -n "$SOURCE_APP_ZIP" && test -s "$SOURCE_APP_ZIP"

          EXTRACT="$RUNNER_TEMP/app-extract"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          ditto -x -k "$SOURCE_APP_ZIP" "$EXTRACT"
          APP="$EXTRACT/${PRODUCT_NAME}.app"
          test -d "$APP"

          OXI="$APP/Contents/Resources/tools/oxipng"
          KINDLING="$APP/Contents/Resources/tools/kindlegen"
          test -x "$OXI"
          test -x "$KINDLING"
          test -s "$APP/Contents/Resources/licenses/OXIPNG-LICENSE.txt"
          test -s "$APP/Contents/Resources/licenses/KINDLING-LICENSE.txt"

          /usr/bin/file "$OXI" | tee "$RUNNER_TEMP/oxipng-info.txt"
          grep -q 'arm64' "$RUNNER_TEMP/oxipng-info.txt"
          "$OXI" --version | tee -a "$RUNNER_TEMP/oxipng-info.txt"
          grep -q '10.1.1' "$RUNNER_TEMP/oxipng-info.txt"

          /usr/bin/file "$KINDLING" | tee "$RUNNER_TEMP/kindling-info.txt"
          grep -q 'arm64' "$RUNNER_TEMP/kindling-info.txt"
          "$KINDLING" --version | tee -a "$RUNNER_TEMP/kindling-info.txt"
          grep -q '0.31.0' "$RUNNER_TEMP/kindling-info.txt"

          printf '%s\n' "$APP" > "$RUNNER_TEMP/app-path.txt"

      - name: Set v1.4 metadata and re-sign every Mach-O
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat "$RUNNER_TEMP/app-path.txt")"
          PLIST="$APP/Contents/Info.plist"

          plist_set() {
            local key="$1" type="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :${key} ${value}" "$PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :${key} ${type} ${value}" "$PLIST"
          }
          plist_set CFBundleShortVersionString string "$PRODUCT_VERSION"
          plist_set CFBundleVersion string "5"
          plist_set CFBundleName string "$PRODUCT_NAME"
          plist_set CFBundleDisplayName string "$PRODUCT_NAME"
          plist_set CFBundleIdentifier string "org.kcc.kindlecn"
          plutil -lint "$PLIST"
          plutil -p "$PLIST" | tee "$RUNNER_TEMP/v14-plist.txt"
          grep -q '1.4.0' "$RUNNER_TEMP/v14-plist.txt"

          xattr -cr "$APP" || true
          while IFS= read -r -d '' f; do
            if /usr/bin/file "$f" | grep -q 'Mach-O'; then
              /usr/bin/codesign --force --sign - --timestamp=none "$f"
            fi
          done < <(find "$APP/Contents" -type f -print0)

          while IFS= read -r bundle; do
            [ -n "$bundle" ] && /usr/bin/codesign --force --sign - --timestamp=none "$bundle"
          done < <(
            find "$APP/Contents" -type d -name '*.framework' -print \
              | awk '{ print length, $0 }' \
              | sort -rn \
              | cut -d' ' -f2-
          )

          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/codesign --verify --strict --verbose=2 "$APP/Contents/Resources/tools/oxipng"
          /usr/bin/codesign --verify --strict --verbose=2 "$APP/Contents/Resources/tools/kindlegen"

      - name: Create v1.4 App archive
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat "$RUNNER_TEMP/app-path.txt")"
          OUT="$RUNNER_TEMP/$APP_ZIP_NAME"
          rm -f "$OUT"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          test -s "$OUT"

      - name: Create DMG with matching project avatar
        shell: bash
        run: |
          set -euo pipefail
          APP="$(cat "$RUNNER_TEMP/app-path.txt")"
          ICON="$APP/Contents/Resources/comic2ebook.icns"
          STAGE="$RUNNER_TEMP/v14-dmg-stage"
          RW_DMG="$RUNNER_TEMP/v14-rw.dmg"
          FINAL_DMG="$RUNNER_TEMP/$DMG_NAME"
          MOUNT="$RUNNER_TEMP/v14-mount"

          rm -rf "$STAGE" "$MOUNT" "$RW_DMG" "$FINAL_DMG"
          mkdir -p "$STAGE" "$MOUNT"
          ditto "$APP" "$STAGE/${PRODUCT_NAME}.app"
          ln -s /Applications "$STAGE/Applications"
          cp "$ICON" "$STAGE/.VolumeIcon.icns"

          hdiutil create \
            -volname "$PRODUCT_NAME" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDRW \
            "$RW_DMG"

          hdiutil attach -readwrite -nobrowse -mountpoint "$MOUNT" "$RW_DMG"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          cp "$ICON" "$MOUNT/.VolumeIcon.icns"
          if command -v SetFile >/dev/null 2>&1; then
            SetFile -a C "$MOUNT"
          elif [ -x /usr/bin/SetFile ]; then
            /usr/bin/SetFile -a C "$MOUNT"
          fi
          sync
          cmp "$ICON" "$MOUNT/.VolumeIcon.icns"
          hdiutil detach "$MOUNT"
          trap - EXIT

          hdiutil convert "$RW_DMG" -format UDZO -o "$FINAL_DMG"
          hdiutil verify "$FINAL_DMG"
          test -s "$FINAL_DMG"

      - name: Mount final DMG and verify App, volume icon and tools
        shell: bash
        run: |
          set -euo pipefail
          DMG="$RUNNER_TEMP/$DMG_NAME"
          MOUNT="$RUNNER_TEMP/v14-final-check"
          rm -rf "$MOUNT"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT

          APP="$MOUNT/${PRODUCT_NAME}.app"
          cmp "$MOUNT/.VolumeIcon.icns" "$APP/Contents/Resources/comic2ebook.icns"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          "$APP/Contents/Resources/tools/oxipng" --version | grep -q '10.1.1'
          "$APP/Contents/Resources/tools/kindlegen" --version | grep -q '0.31.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" | grep -q '^1.4.0$'

          echo 'v1.4 final DMG verification: PASS'
          hdiutil detach "$MOUNT"
          trap - EXIT

      - name: Generate checksums and build information
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(cat "$RUNNER_TEMP/source-run-id.txt")"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$DMG_NAME" "$APP_ZIP_NAME" > SHA256SUMS-v1.4.txt
          cat > BUILD-INFO-v1.4.txt <<EOF
          Product: $PRODUCT_NAME
          Version: $PRODUCT_VERSION
          KCC upstream: 11.0.1 / bd0328a12fe40ab62285d3a8ae3e501f6e41c78b
          Architecture: Apple Silicon arm64
          Source tested build run: $RUN_ID
          JPEG optimizer: mozjpeg-lossless-optimization 1.3.2
          PNG optimizer: OxiPNG 10.1.1 arm64
          MOBI/AZW3 engine: Kindling 0.31.0 arm64
          Signing: ad-hoc
          Compression CI: JPEG/PNG pixel equality + CBZ/EPUB container tests passed before merge
          DMG volume icon: byte-identical to App icon
          EOF
          cat SHA256SUMS-v1.4.txt

      - name: Publish or update GitHub Release v1.4.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KCC Kindle 中文版 v1.4.0" \
              --notes-file RELEASE_NOTES_v1.4.0.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KCC Kindle 中文版 v1.4.0" \
              --notes-file RELEASE_NOTES_v1.4.0.md \
              --target main
          fi

          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/$DMG_NAME" \
            "$RUNNER_TEMP/$APP_ZIP_NAME" \
            "$RUNNER_TEMP/SHA256SUMS-v1.4.txt" \
            "$RUNNER_TEMP/BUILD-INFO-v1.4.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload v1.4 finalized artifact
        uses: actions/upload-artifact@v4
        with:
          name: KCC-Kindle-CN-v1.4-AppleSilicon
          path: |
            ${{ runner.temp }}/${{ env.DMG_NAME }}
            ${{ runner.temp }}/${{ env.APP_ZIP_NAME }}
            ${{ runner.temp }}/SHA256SUMS-v1.4.txt
            ${{ runner.temp }}/BUILD-INFO-v1.4.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
