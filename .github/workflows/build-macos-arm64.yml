name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patch/**'
      - 'build/**'
      - '.github/workflows/build-macos-arm64.yml'
      - 'README.md'
      - 'RELEASE_NOTES_v1.3.0.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'patch/**'
      - 'build/**'
      - '.github/workflows/build-macos-arm64.yml'
      - 'README.md'
      - 'RELEASE_NOTES_v1.3.0.md'

permissions:
  contents: write

concurrency:
  group: kcc-kindle-cn-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/ciromattia/kcc.git
  UPSTREAM_REF: v11.0.1
  UPSTREAM_COMMIT: bd0328a12fe40ab62285d3a8ae3e501f6e41c78b
  PYTHON_VERSION: '3.11'
  PRODUCT_NAME: Kindle漫画转换器
  PRODUCT_VERSION: '1.3.0'
  RELEASE_TAG: v1.3.0
  DMG_NAME: KCC_11.0.1_Kindle_CN_v1.3_AppleSilicon.dmg
  KINDLING_REPO: ciscoriordan/kindling
  KINDLING_TAG: v0.31.0
  KINDLING_ASSET: kindling-cli-mac-apple-silicon
  BUNDLE_ID: org.kcc.kindlecn

jobs:
  build:
    name: Build + test arm64 self-contained app/dmg
    runs-on: macos-15
    timeout-minutes: 55

    steps:
      - name: Checkout customization repo
        uses: actions/checkout@v6

      - name: Privacy scan
        shell: bash
        run: |
          set -euo pipefail
          python3 build/privacy_scan.py .

      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "macOS: $(sw_vers -productVersion)"
          echo "Arch: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Fetch pinned official KCC 11.0.1
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPO" upstream
          cd upstream
          git fetch --depth=1 origin "$UPSTREAM_REF"
          git checkout --detach FETCH_HEAD
          ACTUAL="$(git rev-parse HEAD)"
          echo "Official KCC commit: $ACTUAL"
          test "$ACTUAL" = "$UPSTREAM_COMMIT"

      - name: Apply and validate Kindle Chinese patches
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            patch/patch_kcc.py \
            patch/patch_runtime_v12.py \
            patch/kindle_cn_ui.py \
            patch/kindle_cn_enhancements.py \
            patch/kindlegen_runtime.py

          python patch/patch_kcc.py upstream
          python patch/patch_runtime_v12.py upstream

          python -m py_compile \
            upstream/kindlecomicconverter/KCC_gui.py \
            upstream/kindlecomicconverter/comic2ebook.py \
            upstream/kindlecomicconverter/kindle_cn_ui.py \
            upstream/kindlecomicconverter/kindle_cn_enhancements.py \
            upstream/kindlecomicconverter/kindlegen_runtime.py

          grep -q 'apply_kindle_cn_ui(self, MW)' upstream/kindlecomicconverter/KCC_gui.py
          grep -q 'install_enhancements(self, MW)' upstream/kindlecomicconverter/KCC_gui.py
          grep -q 'Kindle 专用 · 简体中文' upstream/kindlecomicconverter/KCC_gui.py
          grep -q "status.engine == 'kindlegen'" upstream/kindlecomicconverter/KCC_gui.py
          grep -q 'build_mobi_command(item)' upstream/kindlecomicconverter/comic2ebook.py
          grep -q 'self.anyErrors' upstream/kindlecomicconverter/KCC_gui.py

          if grep -q '无广告/推广' upstream/kindlecomicconverter/KCC_gui.py; then
            echo 'ERROR: redundant bottom advertising text still exists'; exit 1
          fi
          if grep -q 'self.versionCheck.start()' upstream/kindlecomicconverter/KCC_gui.py; then
            echo 'ERROR: version/announcement thread is still enabled'; exit 1
          fi
          if grep -q '"Kobo Clara' upstream/kindlecomicconverter/KCC_gui.py; then
            echo 'ERROR: Kobo profiles remain'; exit 1
          fi
          if grep -Fq "subprocess_run(['kindlegen'" upstream/kindlecomicconverter/comic2ebook.py; then
            echo 'ERROR: hard-coded KindleGen subprocess remains'; exit 1
          fi

      - name: Install build dependencies
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller certifi
          python - <<'PY'
          import platform, sys, PySide6
          print('Python', sys.version)
          print('Machine', platform.machine())
          print('PySide6', PySide6.__version__)
          assert platform.machine() == 'arm64'
          PY

      - name: Download and verify Kindling Apple Silicon
        shell: bash
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools licenses "$RUNNER_TEMP/kindling-release"

          gh release download "$KINDLING_TAG" \
            --repo "$KINDLING_REPO" \
            --pattern "$KINDLING_ASSET" \
            --dir "$RUNNER_TEMP/kindling-release"

          cp "$RUNNER_TEMP/kindling-release/$KINDLING_ASSET" tools/kindlegen
          chmod 755 tools/kindlegen

          /usr/bin/file tools/kindlegen | tee ../kindling-binary-info.txt
          grep -q 'arm64' ../kindling-binary-info.txt
          tools/kindlegen --version | tee ../kindling-version.txt
          grep -qi 'kindling' ../kindling-version.txt
          grep -q '0.31.0' ../kindling-version.txt

          ACTUAL_SHA="$(shasum -a 256 tools/kindlegen | awk '{print $1}')"
          RELEASE_DIGEST="$(gh api "repos/${KINDLING_REPO}/releases/tags/${KINDLING_TAG}" \
            --jq '.assets[] | select(.name == env.KINDLING_ASSET) | .digest' | head -n 1)"
          echo "Kindling asset digest from GitHub: $RELEASE_DIGEST"
          echo "Kindling downloaded sha256: sha256:$ACTUAL_SHA"
          [[ "$RELEASE_DIGEST" == sha256:* ]]
          test "sha256:$ACTUAL_SHA" = "$RELEASE_DIGEST"
          printf '%s\n' "$RELEASE_DIGEST" > ../kindling-release-digest.txt

          curl -fsSL \
            "https://raw.githubusercontent.com/${KINDLING_REPO}/${KINDLING_TAG}/LICENSE" \
            -o licenses/KINDLING-LICENSE.txt
          test -s licenses/KINDLING-LICENSE.txt

      - name: Test Kindling resolver and command ordering
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          KCC_KINDLEGEN="$PWD/tools/kindlegen" PYTHONPATH=. python - <<'PY'
          from kindlecomicconverter.kindlegen_runtime import (
              refresh_kindlegen, get_kindlegen_path, build_mobi_command, diagnostic_text
          )
          s = refresh_kindlegen()
          print(s)
          print(diagnostic_text(s))
          assert s.usable, s
          assert s.engine == 'kindling', s
          assert s.version == '0.31.0', s
          assert 'arm64' in s.architecture, s
          assert get_kindlegen_path() == s.path
          cmd = build_mobi_command('/tmp/test.epub')
          print('Kindling KCC command:', cmd)
          assert cmd[0] == s.path
          assert cmd[1] == '/tmp/test.epub'
          assert cmd[2:] == ['-dont_append_source', '-locale', 'en']
          PY

      - name: Create conversion fixture
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/kcc-sample"
          rm -rf "$SAMPLE"
          mkdir -p "$SAMPLE"
          SAMPLE="$SAMPLE" python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import os
          p = Path(os.environ['SAMPLE'])
          for i in range(1, 3):
              img = Image.new('RGB', (900, 1200), 'white')
              d = ImageDraw.Draw(img)
              d.rectangle((80, 80, 820, 1120), outline='black', width=8)
              d.text((120, 120), f'KCC v1.3 smoke page {i}', fill='black')
              img.save(p / f'{i:03d}.jpg', quality=90)
          PY

      - name: Smoke-test EPUB and CBZ conversion core
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/kcc-sample"
          OUT="$RUNNER_TEMP/kcc-out"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python kcc-c2e.py -p KPW5 -f EPUB --nokepub -m -c 1 -o "$OUT" "$SAMPLE"
          EPUB="$(find "$OUT" -maxdepth 1 -type f -name '*.epub' -print -quit)"
          test -n "$EPUB" && test -s "$EPUB"

          rm -rf "$OUT"/*
          python kcc-c2e.py -p KPW5 -f CBZ -m -c 1 -o "$OUT" "$SAMPLE"
          CBZ="$(find "$OUT" -maxdepth 1 -type f -name '*.cbz' -print -quit)"
          test -n "$CBZ" && test -s "$CBZ"

      - name: Smoke-test real MOBI/AZW3 conversion through KCC
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          SAMPLE="$RUNNER_TEMP/kcc-sample"
          OUT="$RUNNER_TEMP/kcc-mobi-out"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          KCC_KINDLEGEN="$PWD/tools/kindlegen" \
            python kcc-c2e.py -p KPW5 -f MOBI -m -c 1 -o "$OUT" "$SAMPLE" \
            2>&1 | tee ../mobi-smoke.log

          if grep -Eq 'Error: KindleGen failed|Error: Failed to tweak KindleGen output|MOBI engine unavailable' ../mobi-smoke.log; then
            echo 'ERROR: KCC reported MOBI conversion/post-processing failure'
            exit 1
          fi

          MOBI="$(find "$OUT" -maxdepth 1 -type f -name '*.mobi' -print -quit)"
          test -n "$MOBI"
          test -s "$MOBI"
          echo "Generated MOBI: $MOBI"
          /usr/bin/file "$MOBI" | tee -a ../mobi-smoke.log
          /usr/bin/file "$MOBI" | grep -qi 'Mobipocket'

          tools/kindlegen dump "$MOBI" > ../mobi-dump.txt 2>&1
          test -s ../mobi-dump.txt
          head -n 30 ../mobi-dump.txt

      - name: Generate Kindle Chinese app icon
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          rm -rf icons/KCCKindle.iconset
          python ../build/make_icon.py icons/KCCKindle.iconset
          iconutil -c icns icons/KCCKindle.iconset -o icons/comic2ebook.icns
          test -s icons/comic2ebook.icns

      - name: Build application with PyInstaller
        shell: bash
        working-directory: upstream
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          set -euo pipefail
          pyinstaller -y kcc-macos.spec
          APP="dist/Kindle Comic Converter.app"
          test -d "$APP"
          /usr/bin/file "$APP/Contents/MacOS/Kindle Comic Converter" | tee ../binary-info.txt
          grep -q 'arm64' ../binary-info.txt

      - name: Rename app, set privacy-safe metadata, and embed Kindling
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          OLD="dist/Kindle Comic Converter.app"
          NEW="dist/${PRODUCT_NAME}.app"
          mv "$OLD" "$NEW"
          PLIST="$NEW/Contents/Info.plist"

          plist_set() {
            local key="$1" type="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :${key} ${value}" "$PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :${key} ${type} ${value}" "$PLIST"
          }
          plist_set CFBundleName string "$PRODUCT_NAME"
          plist_set CFBundleDisplayName string "$PRODUCT_NAME"
          plist_set CFBundleIdentifier string "$BUNDLE_ID"
          plist_set CFBundleShortVersionString string "$PRODUCT_VERSION"
          plist_set CFBundleVersion string "4"
          plist_set NSHighResolutionCapable bool true
          plutil -lint "$PLIST"
          plutil -p "$PLIST" | tee ../plist-info.txt
          grep -q "$BUNDLE_ID" ../plist-info.txt
          if grep -qi 'amster-ilvil' "$PLIST"; then
            echo 'ERROR: personal repository owner identifier leaked into App metadata'; exit 1
          fi

          mkdir -p "$NEW/Contents/Resources/tools" "$NEW/Contents/Resources/licenses"
          cp tools/kindlegen "$NEW/Contents/Resources/tools/kindlegen"
          cp licenses/KINDLING-LICENSE.txt "$NEW/Contents/Resources/licenses/KINDLING-LICENSE.txt"
          chmod 755 "$NEW/Contents/Resources/tools/kindlegen"

          /usr/bin/file "$NEW/Contents/Resources/tools/kindlegen" | tee ../bundled-kindling-info.txt
          grep -q 'arm64' ../bundled-kindling-info.txt
          "$NEW/Contents/Resources/tools/kindlegen" --version | tee -a ../bundled-kindling-info.txt
          grep -q '0.31.0' ../bundled-kindling-info.txt
          test -s "$NEW/Contents/Resources/licenses/KINDLING-LICENSE.txt"

      - name: Ad-hoc sign app and verify
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="dist/${PRODUCT_NAME}.app"
          xattr -cr "$APP" || true

          while IFS= read -r -d '' f; do
            if /usr/bin/file "$f" | grep -q 'Mach-O'; then
              /usr/bin/codesign --force --sign - --timestamp=none "$f"
            fi
          done < <(find "$APP/Contents" -type f -print0)

          while IFS= read -r bundle; do
            [ -n "$bundle" ] && /usr/bin/codesign --force --sign - --timestamp=none "$bundle"
          done < <(find "$APP/Contents" -type d -name '*.framework' -print | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-)

          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/codesign --verify --strict --verbose=2 "$APP/Contents/Resources/tools/kindlegen"
          /usr/bin/codesign -dv --verbose=4 "$APP" 2>&1 | tee ../codesign-info.txt

      - name: Smoke-check bundled engine and Qt UI startup
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="dist/${PRODUCT_NAME}.app"
          EXE="$APP/Contents/MacOS/Kindle Comic Converter"
          ENGINE="$APP/Contents/Resources/tools/kindlegen"
          test -x "$EXE"
          test -x "$ENGINE"
          "$ENGINE" --version | grep -q '0.31.0'

          : > ../launch-smoke.log
          QT_QPA_PLATFORM=offscreen "$EXE" > ../launch-smoke.log 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            echo 'ERROR: app exited during startup smoke test'
            cat ../launch-smoke.log
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo 'UI startup smoke test: PASS' | tee -a ../launch-smoke.log

      - name: Package app and DMG
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent "dist/${PRODUCT_NAME}.app" "package/${PRODUCT_NAME}.app.zip"

          STAGE="dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "dist/${PRODUCT_NAME}.app" "$STAGE/${PRODUCT_NAME}.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "${PRODUCT_NAME}" -srcfolder "$STAGE" -ov -format UDZO "package/${DMG_NAME}"
          hdiutil verify "package/${DMG_NAME}"

      - name: Generate checksums and build report
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          cd package
          shasum -a 256 "${PRODUCT_NAME}.app.zip" "${DMG_NAME}" > SHA256SUMS.txt
          KINDLING_DIGEST="$(cat ../../kindling-release-digest.txt)"
          {
            echo "KCC Kindle 中文版 build report"
            echo "Product: ${PRODUCT_VERSION}"
            echo "Bundle ID: ${BUNDLE_ID}"
            echo "Upstream KCC: v11.0.1 @ ${UPSTREAM_COMMIT}"
            echo "Bundled MOBI engine: Kindling ${KINDLING_TAG} / Apple Silicon arm64"
            echo "Kindling asset digest: ${KINDLING_DIGEST}"
            echo "Runner: $(sw_vers -productVersion) / $(uname -m)"
            echo "Python: $(python --version 2>&1)"
            echo "Privacy scan: PASS"
            echo "Tests: resolver PASS; EPUB PASS; CBZ PASS; MOBI/AZW3 + KCC post-fix PASS; Qt startup PASS"
            echo "Built: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            cat SHA256SUMS.txt
          } > BUILD-INFO.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KCC-Kindle-CN-v1.3-AppleSilicon
          path: |
            upstream/package/${{ env.PRODUCT_NAME }}.app.zip
            upstream/package/${{ env.DMG_NAME }}
            upstream/package/SHA256SUMS.txt
            upstream/package/BUILD-INFO.txt
            codesign-info.txt
            binary-info.txt
            plist-info.txt
            kindling-binary-info.txt
            kindling-version.txt
            kindling-release-digest.txt
            bundled-kindling-info.txt
            mobi-smoke.log
            mobi-dump.txt
            launch-smoke.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release v1.3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            "package/${DMG_NAME}"
            "package/${PRODUCT_NAME}.app.zip"
            "package/SHA256SUMS.txt"
            "package/BUILD-INFO.txt"
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KCC Kindle 中文版 v1.3.0" \
              --notes-file "../RELEASE_NOTES_v1.3.0.md"
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KCC Kindle 中文版 v1.3.0" \
              --notes-file "../RELEASE_NOTES_v1.3.0.md" \
              --latest
          fi
