name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patch/**'
      - 'build/**'
      - '.github/workflows/build-macos-arm64.yml'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'patch/**'
      - 'build/**'
      - '.github/workflows/build-macos-arm64.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: kcc-kindle-cn-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/ciromattia/kcc.git
  UPSTREAM_REF: v11.0.1
  UPSTREAM_COMMIT: bd0328a12fe40ab62285d3a8ae3e501f6e41c78b
  PYTHON_VERSION: '3.11'
  PRODUCT_NAME: Kindle漫画转换器
  PRODUCT_VERSION: '1.1.0'
  DMG_NAME: KCC_11.0.1_Kindle_CN_v1.1_AppleSilicon.dmg

jobs:
  build:
    name: Build arm64 app + dmg
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout customization repo
        uses: actions/checkout@v6

      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "macOS: $(sw_vers -productVersion)"
          echo "Arch: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Fetch official KCC 11.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPO" upstream
          cd upstream
          git fetch --depth=1 origin "$UPSTREAM_REF"
          git checkout --detach FETCH_HEAD
          ACTUAL="$(git rev-parse HEAD)"
          echo "Official commit: $ACTUAL"
          test "$ACTUAL" = "$UPSTREAM_COMMIT"

      - name: Apply and validate Kindle Chinese patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile patch/patch_kcc.py patch/kindle_cn_ui.py patch/kindle_cn_enhancements.py
          python patch/patch_kcc.py upstream
          python -m py_compile \
            upstream/kindlecomicconverter/KCC_gui.py \
            upstream/kindlecomicconverter/kindle_cn_ui.py \
            upstream/kindlecomicconverter/kindle_cn_enhancements.py

          grep -q 'apply_kindle_cn_ui(self, MW)' upstream/kindlecomicconverter/KCC_gui.py
          grep -q 'install_enhancements(self, MW)' upstream/kindlecomicconverter/KCC_gui.py
          grep -q 'Kindle 专用 · 简体中文 · 无广告/推广' upstream/kindlecomicconverter/KCC_gui.py
          grep -q 'self.versionCheck.start()' upstream/kindlecomicconverter/KCC_gui.py && {
            echo 'ERROR: version/announcement thread is still enabled'; exit 1;
          } || true
          grep -q '"Kobo Clara' upstream/kindlecomicconverter/KCC_gui.py && {
            echo 'ERROR: Kobo profiles remain in GUI source after patch'; exit 1;
          } || true
          grep -q 'GUI.kofiButton.clicked.connect' upstream/kindlecomicconverter/KCC_gui.py && {
            echo 'ERROR: Ko-fi button connection remains'; exit 1;
          } || true

      - name: Install build dependencies
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller certifi
          python - <<'PY'
          import platform, sys
          import PySide6
          print('Python', sys.version)
          print('Machine', platform.machine())
          print('PySide6', PySide6.__version__)
          assert platform.machine() == 'arm64'
          PY

      - name: Generate Kindle Chinese app icon
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          rm -rf icons/KCCKindle.iconset
          python ../build/make_icon.py icons/KCCKindle.iconset
          iconutil -c icns icons/KCCKindle.iconset -o icons/comic2ebook.icns
          test -s icons/comic2ebook.icns
          file icons/comic2ebook.icns

      - name: Build application with PyInstaller
        shell: bash
        working-directory: upstream
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          set -euo pipefail
          pyinstaller -y kcc-macos.spec
          APP="dist/Kindle Comic Converter.app"
          test -d "$APP"
          /usr/bin/file "$APP/Contents/MacOS/Kindle Comic Converter"
          /usr/bin/file "$APP/Contents/MacOS/Kindle Comic Converter" | grep -q 'arm64'

      - name: Rename and set bundle metadata
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          OLD="dist/Kindle Comic Converter.app"
          NEW="dist/${PRODUCT_NAME}.app"
          mv "$OLD" "$NEW"
          PLIST="$NEW/Contents/Info.plist"

          plist_set() {
            local key="$1" type="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :${key} ${value}" "$PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :${key} ${type} ${value}" "$PLIST"
          }

          plist_set CFBundleName string "$PRODUCT_NAME"
          plist_set CFBundleDisplayName string "$PRODUCT_NAME"
          plist_set CFBundleIdentifier string "io.github.amster-ilvil.kcc-kindle-cn"
          plist_set CFBundleShortVersionString string "$PRODUCT_VERSION"
          plist_set CFBundleVersion string "2"
          plist_set NSHighResolutionCapable bool true
          plutil -lint "$PLIST"

      - name: Ad-hoc sign app and verify
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="dist/${PRODUCT_NAME}.app"
          xattr -cr "$APP" || true

          while IFS= read -r -d '' f; do
            if /usr/bin/file "$f" | grep -q 'Mach-O'; then
              /usr/bin/codesign --force --sign - --timestamp=none "$f"
            fi
          done < <(find "$APP/Contents" -type f -print0)

          while IFS= read -r bundle; do
            [ -n "$bundle" ] && /usr/bin/codesign --force --sign - --timestamp=none "$bundle"
          done < <(find "$APP/Contents" -type d -name '*.framework' -print | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-)

          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/codesign -dv --verbose=4 "$APP" 2>&1 | tee ../codesign-info.txt

      - name: Smoke-check bundled executable and UI startup
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          APP="dist/${PRODUCT_NAME}.app"
          EXE="$APP/Contents/MacOS/Kindle Comic Converter"
          test -x "$EXE"
          /usr/bin/file "$EXE" | tee ../binary-info.txt
          /usr/bin/file "$EXE" | grep -q 'arm64'
          plutil -p "$APP/Contents/Info.plist" | tee ../plist-info.txt

          # Real startup smoke test: allow Qt to construct the entire redesigned
          # UI offscreen. Import errors, missing plugins and most init crashes
          # will terminate the process and fail this build.
          : > ../launch-smoke.log
          QT_QPA_PLATFORM=offscreen "$EXE" > ../launch-smoke.log 2>&1 &
          PID=$!
          sleep 7
          if ! kill -0 "$PID" 2>/dev/null; then
            echo 'ERROR: app exited during startup smoke test'
            cat ../launch-smoke.log
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo 'UI startup smoke test: PASS' | tee -a ../launch-smoke.log

      - name: Package .app zip preserving macOS metadata
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent "dist/${PRODUCT_NAME}.app" "package/${PRODUCT_NAME}.app.zip"

      - name: Create DMG with hdiutil
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          STAGE="dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "dist/${PRODUCT_NAME}.app" "$STAGE/${PRODUCT_NAME}.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "${PRODUCT_NAME}" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "package/${DMG_NAME}"
          hdiutil verify "package/${DMG_NAME}"

      - name: Generate checksums and build report
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          cd package
          shasum -a 256 "${PRODUCT_NAME}.app.zip" "${DMG_NAME}" > SHA256SUMS.txt
          {
            echo "KCC Kindle 中文版 build report"
            echo "Product: ${PRODUCT_VERSION}"
            echo "Upstream: v11.0.1 @ ${UPSTREAM_COMMIT}"
            echo "Runner: $(sw_vers -productVersion) / $(uname -m)"
            echo "Python: $(python --version 2>&1)"
            echo "Built: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            cat SHA256SUMS.txt
          } > BUILD-INFO.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KCC-Kindle-CN-v1.1-AppleSilicon
          path: |
            upstream/package/${{ env.PRODUCT_NAME }}.app.zip
            upstream/package/${{ env.DMG_NAME }}
            upstream/package/SHA256SUMS.txt
            upstream/package/BUILD-INFO.txt
            codesign-info.txt
            binary-info.txt
            plist-info.txt
            launch-smoke.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30