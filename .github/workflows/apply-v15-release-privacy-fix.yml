name: Apply v1.5 release privacy fix

on:
  push:
    branches: [ fix/v15-release-privacy ]
    paths:
      - 'build/apply_v15_release_privacy_fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v15-release-privacy
          fetch-depth: 0
      - name: Apply exact source transformation
        run: python3 build/apply_v15_release_privacy_fix.py
      - name: Validate and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/release-v15-smart-compression.yml').read_text(encoding='utf-8')
          assert 'github-actions' in text
          assert 'user.email "github-actions$(printf' in text
          PY
          git diff --check
          git config user.name github-actions
          git config user.email "github-actions$(printf '\100')users.noreply.github.com"
          git add .github/workflows/release-v15-smart-compression.yml
          if ! git diff --cached --quiet; then
            git commit -m '修复 v1.5 发布流水线隐私扫描冲突'
            git push origin HEAD:fix/v15-release-privacy
          fi
