name: Test lossless compression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'patch/kindle_cn_compress.py'
      - 'patch/kindle_cn_enhancements.py'
      - 'patch/patch_runtime_v12.py'
      - 'patch/patch_compression.py'
      - '.github/workflows/compression-feature-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compression:
    name: Pixel-lossless compression + container tests
    runs-on: macos-15
    timeout-minutes: 35
    env:
      UPSTREAM_COMMIT: bd0328a12fe40ab62285d3a8ae3e501f6e41c78b

    steps:
      - name: Checkout customization repo
        uses: actions/checkout@v6

      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          test "$(uname -m)" = "arm64"
          rustc --version
          cargo --version

      - name: Set up Python 3.11 arm64
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Fetch pinned official KCC 11.0.1 and apply patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ciromattia/kcc.git upstream
          cd upstream
          git fetch --depth=1 origin v11.0.1
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          cd ..

          python -m py_compile \
            patch/patch_kcc.py \
            patch/patch_runtime_v12.py \
            patch/kindle_cn_ui.py \
            patch/kindle_cn_enhancements.py \
            patch/kindle_cn_compress.py

          python patch/patch_kcc.py upstream
          python patch/patch_runtime_v12.py upstream

          test -s upstream/kindlecomicconverter/kindle_cn_compress.py
          grep -q "tools/oxipng" upstream/kcc-macos.spec
          test -x upstream/tools/oxipng
          test -s upstream/licenses/OXIPNG-LICENSE.txt
          /usr/bin/file upstream/tools/oxipng | tee oxipng-file.txt
          grep -q 'arm64' oxipng-file.txt
          upstream/tools/oxipng --version | tee oxipng-version.txt
          grep -q '10.1.1' oxipng-version.txt

      - name: Install KCC runtime requirements
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run JPEG PNG CBZ and EPUB lossless compression tests
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZIP_STORED, ZipFile
          import io

          from PIL import Image, ImageDraw
          from kindlecomicconverter.kindle_cn_compress import compress_sources, find_oxipng

          def pixels_from_bytes(data: bytes):
              with Image.open(io.BytesIO(data)) as im:
                  im.load()
                  return im.convert('RGBA').size, im.convert('RGBA').tobytes()

          def pixels_from_path(path: Path):
              return pixels_from_bytes(path.read_bytes())

          def make_fixture(folder: Path):
              folder.mkdir(parents=True, exist_ok=True)

              jpg = Image.new('RGB', (1000, 1400), 'white')
              d = ImageDraw.Draw(jpg)
              for y in range(50, 1350, 55):
                  d.line((40, y, 960, y), fill=(20 + y % 120, 20, 20), width=3)
              d.rectangle((100, 100, 900, 1300), outline='black', width=8)
              jpg.save(folder / '001.jpg', 'JPEG', quality=92, progressive=False, optimize=False)

              png = Image.new('RGBA', (900, 1200), (255, 255, 255, 255))
              d = ImageDraw.Draw(png)
              for x in range(0, 900, 20):
                  d.rectangle((x, 0, min(899, x + 9), 1199), fill=(x % 255, 80, 160, 255))
              png.save(folder / '002.png', 'PNG', compress_level=0)

          with TemporaryDirectory(prefix='kcc-compress-ci-') as td:
              root = Path(td)
              source = root / 'source'
              make_fixture(source)
              original_pixels = {p.name: pixels_from_path(p) for p in source.iterdir()}
              original_total = sum(p.stat().st_size for p in source.iterdir())

              oxi = find_oxipng()
              assert oxi is not None and oxi.is_file(), oxi
              print('OxiPNG:', oxi)

              out = root / 'out'
              result = compress_sources([source], out, strip_metadata=True)[0]
              cbz = Path(result.output)
              assert cbz.is_file() and cbz.suffix == '.cbz'
              assert result.images_seen == 2
              assert result.images_optimized >= 1
              assert result.used_oxipng, result
              assert cbz.stat().st_size < original_total

              with ZipFile(cbz) as zf:
                  names = set(zf.namelist())
                  assert {'001.jpg', '002.png'} <= names
                  for name, expected in original_pixels.items():
                      assert pixels_from_bytes(zf.read(name)) == expected, name

              # Existing CBZ: unpack -> optimize -> repack, never make container larger.
              source_cbz = root / 'input.cbz'
              with ZipFile(source_cbz, 'w', compression=ZIP_STORED) as zf:
                  zf.write(source / '001.jpg', '001.jpg')
                  zf.write(source / '002.png', '002.png')
              cbz_result = compress_sources([source_cbz], out, strip_metadata=True)[0]
              optimized_cbz = Path(cbz_result.output)
              assert optimized_cbz.stat().st_size <= source_cbz.stat().st_size
              with ZipFile(optimized_cbz) as zf:
                  for name, expected in original_pixels.items():
                      assert pixels_from_bytes(zf.read(name)) == expected, name

              # Minimal EPUB: mimetype must stay first and ZIP_STORED.
              epub = root / 'input.epub'
              html = b'<html xmlns="http://www.w3.org/1999/xhtml"><body><img src="Images/002.png"/></body></html>'
              with ZipFile(epub, 'w') as zf:
                  zf.writestr('mimetype', b'application/epub+zip', compress_type=ZIP_STORED)
                  zf.writestr('OEBPS/page.xhtml', html)
                  zf.writestr('OEBPS/Images/002.png', (source / '002.png').read_bytes(), compress_type=ZIP_STORED)
              epub_pixels = pixels_from_path(source / '002.png')
              epub_result = compress_sources([epub], out, strip_metadata=True)[0]
              optimized_epub = Path(epub_result.output)
              assert optimized_epub.is_file()
              with ZipFile(optimized_epub) as zf:
                  first = zf.infolist()[0]
                  assert first.filename == 'mimetype'
                  assert first.compress_type == ZIP_STORED
                  assert zf.read('mimetype') == b'application/epub+zip'
                  assert zf.read('OEBPS/page.xhtml') == html
                  assert pixels_from_bytes(zf.read('OEBPS/Images/002.png')) == epub_pixels

              # Multiple direct images are intentionally grouped into one CBZ.
              direct_result = compress_sources(
                  [source / '001.jpg', source / '002.png'], out, strip_metadata=False
              )[0]
              direct_cbz = Path(direct_result.output)
              assert direct_cbz.is_file()
              with ZipFile(direct_cbz) as zf:
                  assert zf.namelist() == ['0001.jpg', '0002.png']
                  assert pixels_from_bytes(zf.read('0001.jpg')) == original_pixels['001.jpg']
                  assert pixels_from_bytes(zf.read('0002.png')) == original_pixels['002.png']

              print('LOSSLESS COMPRESSION TEST: PASS')
              print('folder source bytes:', original_total)
              print('generated cbz bytes:', cbz.stat().st_size)
              print('images optimized:', result.images_optimized, '/', result.images_seen)
          PY

      - name: Validate UI imports compression module
        shell: bash
        working-directory: upstream
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from kindlecomicconverter import kindle_cn_enhancements as ux
          from kindlecomicconverter import kindle_cn_compress as comp
          assert hasattr(ux, '_CompressionWorker')
          assert callable(comp.compress_sources)
          assert callable(comp.find_oxipng)
          print('Compression UI import: PASS')
          PY
