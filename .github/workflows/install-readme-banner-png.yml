name: Install README PNG banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-readme-banner-png.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Rebuild validated source WebP
        shell: bash
        run: |
          set -euo pipefail

          : > /tmp/readme_banner.b64
          for sha in \
            4bca8ec5cd8f05bbf9ef7800a4e7129741d2b2e8 \
            02c640266b717f615daee433c81d772bc3a7885b \
            e61c8169621b3df5cf177eff10c349aa92535a62 \
            0a4b929778cbf7086148c1bda0130417c2307a0e \
            9048bc603132e7b8586f21c6948ce9acd00ee74c \
            317d6d59472fbab4b2ce34327a97300ac218069b \
            870a1648b1570bfa63586c0d6aaddb3a6b2d66ac \
            2618a38f568b36dfecf676e0ca71e9a718b736bc
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' \
              | base64 -d >> /tmp/readme_banner.b64
          done

          base64 -d /tmp/readme_banner.b64 > /tmp/readme_banner.webp

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('/tmp/readme_banner.webp')
          data = p.read_bytes()
          if len(data) < 30 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('source is not a valid WebP RIFF payload')
          declared = int.from_bytes(data[4:8], 'little') + 8
          if declared != len(data):
              raise SystemExit(f'WebP size mismatch: declared {declared}, got {len(data)}')
          if data[12:16] != b'VP8X':
              raise SystemExit('expected VP8X WebP source')
          width = int.from_bytes(data[24:27], 'little') + 1
          height = int.from_bytes(data[27:30], 'little') + 1
          if (width, height) != (2048, 720):
              raise SystemExit(f'unexpected source dimensions: {width}x{height}')
          print(f'validated source: {width}x{height}, {len(data)} bytes')
          print('source sha256:', hashlib.sha256(data).hexdigest())
          PY

      - name: Convert source to lightweight PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          src = Path('/tmp/readme_banner.webp')
          dst = Path('assets/readme_banner.png')

          with Image.open(src) as im:
              im.load()
              if im.size != (2048, 720):
                  raise SystemExit(f'unexpected decoded dimensions: {im.size}')
              rgba = im.convert('RGBA')
              # README banner: 256-color palette keeps the PNG compact while
              # retaining the original layout and transparency.
              out = rgba.quantize(colors=256, method=Image.Quantize.FASTOCTREE)
              out.save(dst, format='PNG', optimize=True)

          data = dst.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('output is not a valid PNG')
          width = int.from_bytes(data[16:20], 'big')
          height = int.from_bytes(data[20:24], 'big')
          if (width, height) != (2048, 720):
              raise SystemExit(f'unexpected PNG dimensions: {width}x{height}')
          print(f'validated PNG: {width}x{height}, {len(data)} bytes')
          print('png sha256:', hashlib.sha256(data).hexdigest())
          PY

      - name: Point README to PNG and remove obsolete installer assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '<img src="assets/readme_banner.webp" alt="KCC Kindle 中文版">'
          new = '<img src="assets/readme_banner.png" alt="KCC Kindle 中文版">'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('README banner image reference not found')
          readme.write_text(text, encoding='utf-8')
          PY

          rm -f assets/readme_banner.webp
          rm -f .github/workflows/install-readme-banner-png.yml

          test -s assets/readme_banner.png
          grep -F 'assets/readme_banner.png' README.md
          if grep -Fq 'assets/readme_banner.webp' README.md; then
            echo 'README still references WebP banner' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/readme_banner.png assets/readme_banner.webp .github/workflows/install-readme-banner-png.yml
          git commit -m 'fix: replace broken README banner with PNG'
          git push origin HEAD:main
