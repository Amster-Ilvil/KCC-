name: Install README banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-readme-banner.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild banner and update README
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/readme_banner.b64
          for sha in \
            4bca8ec5cd8f05bbf9ef7800a4e7129741d2b2e8 \
            02c640266b717f615daee433c81d772bc3a7885b \
            e61c8169621b3df5cf177eff10c349aa92535a62 \
            0a4b929778cbf7086148c1bda0130417c2307a0e \
            9048bc603132e7b8586f21c6948ce9acd00ee74c \
            317d6d59472fbab4b2ce34327a97300ac218069b \
            870a1648b1570bfa63586c0d6aaddb3a6b2d66ac \
            2618a38f568b36dfecf676e0ca71e9a718b736bc
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' \
              | base64 -d >> /tmp/readme_banner.b64
          done

          base64 -d /tmp/readme_banner.b64 > assets/readme_banner.webp
          echo "98a869c12632ebf7112212806bc9a0eb503c284239637b1bb0e9e11a375b4099  assets/readme_banner.webp" | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          old = '''<p align="center">
            <img src="assets/project_avatar.webp" width="180" alt="KCC Kindle 中文版项目头像">
          </p>'''
          new = '''<p align="center">
            <img src="assets/readme_banner.webp" width="100%" alt="KCC Kindle 中文版">
          </p>'''
          if old not in s:
              raise SystemExit("README avatar block not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/readme_banner.webp
          git commit -m "docs: replace README icon with banner"
          git push