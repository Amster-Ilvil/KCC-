name: Install README banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-readme-banner.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild, validate and install banner
        shell: bash
        run: |
          set -euo pipefail

          : > /tmp/readme_banner.b64
          for sha in \
            4bca8ec5cd8f05bbf9ef7800a4e7129741d2b2e8 \
            02c640266b717f615daee433c81d772bc3a7885b \
            e61c8169621b3df5cf177eff10c349aa92535a62 \
            0a4b929778cbf7086148c1bda0130417c2307a0e \
            9048bc603132e7b8586f21c6948ce9acd00ee74c \
            317d6d59472fbab4b2ce34327a97300ac218069b \
            870a1648b1570bfa63586c0d6aaddb3a6b2d66ac \
            2618a38f568b36dfecf676e0ca71e9a718b736bc
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' \
              | base64 -d >> /tmp/readme_banner.b64
          done

          base64 -d /tmp/readme_banner.b64 > assets/readme_banner.webp

          python - <<'PY'
          from pathlib import Path
          import hashlib

          image = Path("assets/readme_banner.webp")
          data = image.read_bytes()

          if len(data) < 30 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("Rebuilt banner is not a valid WebP RIFF file")

          declared_size = int.from_bytes(data[4:8], "little") + 8
          if declared_size != len(data):
              raise SystemExit(
                  f"WebP size mismatch: RIFF declares {declared_size} bytes, got {len(data)}"
              )

          if data[12:16] != b"VP8X":
              raise SystemExit("Expected VP8X WebP banner")

          width = int.from_bytes(data[24:27], "little") + 1
          height = int.from_bytes(data[27:30], "little") + 1
          if (width, height) != (2048, 720):
              raise SystemExit(f"Unexpected banner dimensions: {width}x{height}")

          print(f"Validated banner: {width}x{height}, {len(data)} bytes")
          print("SHA-256:", hashlib.sha256(data).hexdigest())

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          old = '''<p align="center">
            <img src="assets/project_avatar.webp" width="180" alt="KCC Kindle 中文版项目头像">
          </p>'''
          new = '''<p align="center">
            <img src="assets/readme_banner.webp" alt="KCC Kindle 中文版">
          </p>'''

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("README top image block is neither the old icon nor the new banner")

          readme.write_text(text, encoding="utf-8")
          PY

          # This workflow is only a one-time binary installer. Remove it after success.
          rm -f .github/workflows/install-readme-banner.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: replace README icon with banner"
          git push